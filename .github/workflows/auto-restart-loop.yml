name: 🔄 Auto Restart Loop

on:
  workflow_run:
    workflows:
      - "🔵 LSCPU Phase"
      - "🟢 Hello Phase"
    types:
      - completed

permissions:
  actions: read

jobs:
  restart-if-idle:
    runs-on: ubuntu-latest
    steps:
      - name: Cek apakah ada workflow lain yang sedang berjalan
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"

          # Fungsi mengecek status in_progress
          check_in_progress() {
            WF_FILE=$1
            RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/workflows/$WF_FILE/runs?status=in_progress&per_page=1")
            TOTAL=$(echo "$RUNS" | jq '.total_count')
            [ "$TOTAL" -gt 0 ] && return 0 || return 1
          }

          if check_in_progress "phase-lscpu.yml"; then
            echo "⏳ LSCPU Phase masih berjalan. Tidak perlu restart."
            echo "idle=false" >> $GITHUB_OUTPUT
          elif check_in_progress "phase-hello.yml"; then
            echo "⏳ Hello Phase masih berjalan. Tidak perlu restart."
            echo "idle=false" >> $GITHUB_OUTPUT
          else
            echo "⚡ Tidak ada workflow aktif. Loop terhenti."
            echo "idle=true" >> $GITHUB_OUTPUT
          fi

      - name: Mulai ulang loop via Hello Phase
        if: steps.check.outputs.idle == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Memulai ulang Hello Phase..."
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/phase-hello.yml/dispatches \
            -d '{"ref":"main","inputs":{"loop_count":"9999"}}'
          echo "✅ Loop telah dihidupkan kembali."