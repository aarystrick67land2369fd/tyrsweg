name: 🟡 Standby Phase

on:
  schedule:
    - cron: '*/5 0 * * *'      # setiap 5 menit pada 00:00–00:59 UTC (07:00–07:59 WIB)
  workflow_dispatch:            # opsional untuk pengujian manual

permissions:
  actions: read                 # untuk membaca status run

jobs:
  restart-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Cek apakah ada workflow yang sedang berjalan
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          WF_LSCPU="phase-lscpu.yml"
          WF_HELLO="phase-hello.yml"

          # Fungsi mengecek status in_progress
          check_in_progress() {
            WF_FILE=$1
            RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/workflows/$WF_FILE/runs?status=in_progress&per_page=1")
            TOTAL=$(echo "$RUNS" | jq '.total_count')
            [ "$TOTAL" -gt 0 ] && return 0 || return 1
          }

          if check_in_progress "$WF_LSCPU"; then
            echo "✅ LSCPU Phase sedang berjalan."
            echo "running=true" >> $GITHUB_OUTPUT
          elif check_in_progress "$WF_HELLO"; then
            echo "✅ Hello Phase sedang berjalan."
            echo "running=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Tidak ada workflow yang aktif."
            echo "running=false" >> $GITHUB_OUTPUT
          fi

      - name: Mulai ulang loop via Hello Phase
        if: steps.check.outputs.running == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Memulai ulang Hello Phase..."
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/phase-hello.yml/dispatches \
            -d '{"ref":"main","inputs":{"loop_count":"9999"}}'
          echo "✅ Hello Phase telah dipanggil. Loop akan kembali berjalan."